<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Enterprise Gateway - 2FA Login</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --accent-teal: #0d9488;
      --accent-gold: #eab308;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      color: var(--accent-gold);
      font-size: 22px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 12px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-teal);
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-teal);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0f766e;
    }
    .hidden {
      display: none !important;
    }
    .msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
    .error { color: #ef4444; }
    .success { color: #10b981; }
  </style>
</head>
<body>

<div class="card">
  <form id="loginForm">
    <h2>Secure Gateway Login</h2>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="name@domain.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit">Continue to 2FA</button>
  </form>

  <form id="verifyForm" class="hidden">
    <h2>Two-Factor Authentication</h2>
    <p style="font-size: 13px; color: var(--text-muted); text-align: center;">Enter the 6-digit code sent to your email.</p>
    <div class="form-group">
      <label>Verification Code</label>
      <input type="text" id="code" maxlength="6" required placeholder="123456" style="text-align: center; letter-spacing: 6px; font-size: 20px;">
    </div>
    <button type="submit">Verify & Login</button>
  </form>

  <div id="message" class="msg"></div>
</div>

<script>
  let userEmail = '';

  const loginForm = document.getElementById('loginForm');
  const verifyForm = document.getElementById('verifyForm');
  const messageDiv = document.getElementById('message');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    userEmail = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    messageDiv.textContent = 'Authenticating credentials...';
    messageDiv.className = 'msg';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, password })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Login failed');

      messageDiv.textContent = data.message;
      messageDiv.className = 'msg success';
      loginForm.classList.add('hidden');
      verifyForm.classList.remove('hidden');
    } catch (err) {
      messageDiv.textContent = err.message;
      messageDiv.className = 'msg error';
    }
  });

  verifyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('code').value;
    messageDiv.textContent = 'Verifying security code...';
    messageDiv.className = 'msg';

    try {
      const res = await fetch('/api/auth/verify-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, code })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Verification failed');

      messageDiv.textContent = 'Access granted! Redirecting...';
      messageDiv.className = 'msg success';
      setTimeout(() => {
        window.location.href = '/dashboard.html';
      }, 1000);
    } catch (err) {
      messageDiv.textContent = err.message;
      messageDiv.className = 'msg error';
    }
  });
</script>

</body>
</html>

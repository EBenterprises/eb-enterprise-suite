<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault | Dynamic Cryptographic Interface</title>
    <style>
        :root {
            --bg-obsidian: #0B0F12;
            --panel-bg: #12181F;
            --accent-teal: #008080;
            --accent-teal-glow: rgba(0, 128, 128, 0.4);
            --accent-gold: #D4AF37;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
        }
        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--accent-teal);
            box-shadow: 0 0 20px var(--accent-teal-glow);
            padding: 2rem;
            border-radius: 4px;
        }
        h1 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--accent-teal);
            padding-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        textarea, input {
            width: 100%;
            background: #06080A;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        button {
            background: var(--accent-teal);
            color: var(--bg-obsidian);
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--accent-gold);
        }
        .output-box {
            margin-top: 1rem;
            background: #06080A;
            border: 1px dashed var(--accent-gold);
            padding: 1rem;
            word-break: break-all;
            min-height: 40px;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dynamic Payload Interface</h1>
        
        <div class="form-group">
            <label for="payloadInput">Plaintext Payload:</label>
            <textarea id="payloadInput" rows="4" placeholder="Enter sensitive shipping instructions or data..."></textarea>
            <button onclick="encryptData()" style="margin-top: 1rem;">Encrypt Payload</button>
        </div>

        <div class="form-group">
            <label>Encrypted Hex Output:</label>
            <div id="encryptedOutput" class="output-box">[Awaiting Input]</div>
            <button onclick="decryptData()" style="margin-top: 1rem; background: var(--accent-gold); color: var(--bg-obsidian);">Decrypt Payload</button>
        </div>

        <div class="form-group">
            <label>Decrypted Result:</label>
            <div id="decryptedOutput" class="output-box">[Awaiting Action]</div>
        </div>
    </div>

    <script>
        let currentHex = "";

        async function encryptData() {
            const payload = document.getElementById('payloadInput').value;
            const response = await fetch('/api/encrypt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payload })
            });
            const data = await response.json();
            if (data.status === 'success') {
                currentHex = data.encrypted_hex;
                document.getElementById('encryptedOutput').innerText = currentHex;
            } else {
                document.getElementById('encryptedOutput').innerText = "Error: " + data.error;
            }
        }

        async function decryptData() {
            if (!currentHex) {
                document.getElementById('decryptedOutput').innerText = "Error: No encrypted payload available.";
                return;
            }
            const response = await fetch('/api/decrypt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ encrypted_hex: currentHex })
            });
            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('decryptedOutput').innerText = data.decrypted_payload;
            } else {
                document.getElementById('decryptedOutput').innerText = "Error: " + data.error;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Messaging App v6 (Advanced)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
            <h2 class="text-2xl font-bold mb-4 text-center text-indigo-400">Join Chat v6</h2>
            <input type="text" id="username-input" placeholder="Enter your username..." class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 mb-4 text-slate-100">
            
            <label class="block text-sm text-slate-400 mb-2">Select Channel:</label>
            <select id="room-select" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 mb-6 text-slate-100">
                <option value="general"># general</option>
                <option value="dev"># dev</option>
                <option value="random"># random</option>
            </select>

            <button id="join-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition">Enter Chat</button>
        </div>
    </div>

    <!-- Main App Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Rooms & Users -->
        <div class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col hidden md:flex">
            <div class="p-4 border-b border-slate-700 font-bold text-indigo-400 flex items-center justify-between">
                <span>Channels</span>
            </div>
            <ul id="channel-list" class="p-2 space-y-1 border-b border-slate-700 text-sm">
                <li data-room="general" class="channel-btn px-3 py-2 rounded-lg cursor-pointer bg-slate-700/60 font-semibold text-indigo-300"># general</li>
                <li data-room="dev" class="channel-btn px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-700/40 text-slate-300"># dev</li>
                <li data-room="random" class="channel-btn px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-700/40 text-slate-300"># random</li>
            </ul>

            <div class="p-4 border-b border-slate-700 font-bold text-indigo-400 text-xs uppercase tracking-wider">Active Users</div>
            <ul id="user-list" class="flex-1 overflow-y-auto p-4 space-y-2 text-sm">
                <!-- Dynamic Active Users -->
            </ul>
        </div>

        <!-- Chat Window -->
        <div class="flex-1 flex flex-col bg-slate-900">
            <div class="p-4 bg-slate-800 border-b border-slate-700 font-bold flex justify-between items-center">
                <span id="room-title" class="text-indigo-400"># general</span>
                <span id="typing-indicator" class="text-xs text-slate-400 italic"></span>
            </div>

            <!-- Messages Area -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
                <!-- Dynamic Messages -->
            </div>

            <!-- Input Area -->
            <form id="chat-form" class="p-4 bg-slate-800 border-t border-slate-700 flex gap-2 items-center">
                <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-slate-300 text-sm transition flex items-center justify-center">
                    📁 <input type="file" id="file-input" class="hidden">
                </label>
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" class="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-100">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-medium transition">Send</button>
            </form>
        </div>
    </div>

    <script>
        const socket = io();

        const loginModal = document.getElementById('login-modal');
        const usernameInput = document.getElementById('username-input');
        const roomSelect = document.getElementById('room-select');
        const joinBtn = document.getElementById('join-btn');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const fileInput = document.getElementById('file-input');
        const chatMessages = document.getElementById('chat-messages');
        const userList = document.getElementById('user-list');
        const roomTitle = document.getElementById('room-title');
        const typingIndicator = document.getElementById('typing-indicator');
        const channelBtns = document.querySelectorAll('.channel-btn');

        let currentUser = '';
        let currentRoom = 'general';
        let typingTimeout;
        let attachedFile = null;

        joinBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            if (username) {
                currentUser = username;
                currentRoom = roomSelect.value;
                roomTitle.textContent = `# ${currentRoom}`;
                socket.emit('join_room', { username: currentUser, room: currentRoom });
                loginModal.classList.add('hidden');
            }
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });

        channelBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                channelBtns.forEach(b => b.classList.remove('bg-slate-700/60', 'font-semibold', 'text-indigo-300'));
                btn.classList.add('bg-slate-700/60', 'font-semibold', 'text-indigo-300');
                currentRoom = btn.getAttribute('data-room');
                roomTitle.textContent = `# ${currentRoom}`;
                chatMessages.innerHTML = '';
                socket.emit('join_room', { username: currentUser, room: currentRoom });
            });
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    attachedFile = {
                        data: event.target.result,
                        name: file.name,
                        type: file.type
                    };
                    msgInput.placeholder = `Attached: ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (text || attachedFile) {
                socket.emit('chat_message', { 
                    text: text || (attachedFile ? `Shared file: ${attachedFile.name}` : ''), 
                    file: attachedFile ? attachedFile.data : null,
                    fileName: attachedFile ? attachedFile.name : null
                });
                msgInput.value = '';
                msgInput.placeholder = 'Type a message...';
                attachedFile = null;
                fileInput.value = '';
                socket.emit('typing', false);
            }
        });

        msgInput.addEventListener('input', () => {
            socket.emit('typing', true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', false);
            }, 1000);
        });

        function appendMessage(data) {
            const div = document.createElement('div');
            const isSystem = data.user === 'System';
            
            if (isSystem) {
                div.className = 'text-center text-xs text-slate-500 my-2';
                div.innerHTML = `<span>${data.text}</span>`;
            } else {
                div.className = 'flex flex-col';
                let fileHTML = '';
                if (data.file) {
                    if (data.fileName && /\.(jpg|jpeg|png|gif|webp)$/i.test(data.fileName)) {
                        fileHTML = `<div class="mt-2"><img src="${data.file}" class="max-w-xs rounded-lg border border-slate-700"></div>`;
                    } else {
                        fileHTML = `<div class="mt-2"><a href="${data.file}" download="${data.fileName || 'file'}" class="text-indigo-400 underline text-xs">📥 Download ${data.fileName || 'attachment'}</a></div>`;
                    }
                }

                div.innerHTML = `
                    <div class="flex items-baseline gap-2">
                        <span class="font-bold text-indigo-400 text-sm">${data.user}</span>
                        <span class="text-xs text-slate-500">${data.time}</span>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg mt-1 max-w-md border border-slate-700/50 text-slate-200">
                        <div>${data.text}</div>
                        ${fileHTML}
                    </div>
                `;
            }
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        socket.on('load_history', (history) => {
            chatMessages.innerHTML = '';
            history.forEach(msg => appendMessage(msg));
        });

        socket.on('message', (data) => {
            appendMessage(data);
        });

        socket.on('update_users', (users) => {
            userList.innerHTML = users.map(user => `<li class="text-slate-300 flex items-center gap-2"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span>${user}</li>`).join('');
        });

        socket.on('typing', (data) => {
            if (data.isTyping) {
                typingIndicator.textContent = `${data.user} is typing...`;
            } else {
                typingIndicator.textContent = '';
            }
        });
    </script>
</body>
</html>

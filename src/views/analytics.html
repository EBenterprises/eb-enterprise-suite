<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Analytics | Executive Spectrum</title>
    <style>
        :root {
            --bg-obsidian: #0b0f19;
            --surface-dark: #131c2e;
            --teal-accent: #00d2c4;
            --gold-highlight: #f39c12;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
        }
        sidebar {
            width: 250px;
            background-color: var(--surface-dark);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .sidebar-brand {
            padding: 1.5rem;
            font-size: 1.125rem;
            font-weight: bold;
            color: var(--teal-accent);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .nav-links li a {
            display: block;
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .nav-links li.active a, .nav-links li a:hover {
            background-color: rgba(0, 210, 196, 0.1);
            color: var(--teal-accent);
            border-left: 3px solid var(--teal-accent);
        }
        .main-content {
            flex: 1;
            padding: 2.5rem;
            box-sizing: border-box;
            overflow-y: auto;
            height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        h1 { margin: 0; color: var(--text-main); font-size: 1.75rem; }
        .card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            text-align: left;
            padding: 0.85rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }
        th { color: var(--text-muted); }
        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.875rem;
        }
        .logout-btn:hover { background-color: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>
    <sidebar>
        <div class="sidebar-brand">Executive Suite</div>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/settings">Settings</a></li>
            <li class="active"><a href="/analytics">Audit Analytics</a></li>
        </ul>
    </sidebar>
    <div class="main-content">
        <div class="header">
            <h1>Audit Log Analytics</h1>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
        <div class="card">
            <h3>Complete Security Log Feed</h3>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Immutable activity logging for all state changes and authentications.</p>
            <table>
                <thead>
                    <tr>
                        <th>Log ID</th>
                        <th>Event Action</th>
                        <th>Origin IP</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="fullAnalyticsBody">
                    <tr><td colspan="4" style="color: var(--text-muted);">Loading audit streams...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        fetch('/api/user')
            .then(res => res.json())
            .then(data => {
                if (data.logs) {
                    const tbody = document.getElementById('fullAnalyticsBody');
                    if (data.logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted);">No activity recorded.</td></tr>';
                    } else {
                        tbody.innerHTML = data.logs.map(log => `
                            <tr>
                                <td>#${log.id}</td>
                                <td style="color: var(--teal-accent); font-weight: bold;">${log.action}</td>
                                <td>${log.ip}</td>
                                <td style="color: var(--text-muted);">${new Date(log.timestamp).toLocaleString()}</td>
                            </tr>
                        `).join('');
                    }
                }
            })
            .catch(err => console.error('Failed to load logs'));
    </script>
</body>
</html>

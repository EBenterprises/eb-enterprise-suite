<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault | Encryption Engine</title>
    <style>
    :root {
        --bg-obsidian: #0b0f19;
        --card-bg: #111827;
        --border-teal: #0d9488;
        --accent-gold: #f59e0b;
        --text-main: #e2e8f0;
        --text-muted: #9ca3af;
        --hover-teal: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
        background-color: var(--bg-obsidian);
        color: var(--text-main);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    @media (min-width: 768px) {
        body {
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }
    }
    .sidebar {
        width: 100%;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border-teal);
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 1rem;
        gap: 1rem;
        overflow-x: auto;
    }
    @media (min-width: 768px) {
        .sidebar {
            width: 260px;
            height: 100vh;
            border-bottom: none;
            border-right: 1px solid var(--border-teal);
            flex-direction: column;
            align-items: stretch;
            padding: 2rem 1.5rem;
            gap: 0.4rem;
            overflow-x: visible;
        }
    }
    .sidebar h1 {
        color: var(--accent-gold);
        font-size: 1rem;
        margin: 0;
        letter-spacing: 1px;
        white-space: nowrap;
    }
    @media (min-width: 768px) {
        .sidebar h1 {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
    }
    .sidebar a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.85rem;
        white-space: nowrap;
        transition: color 0.2s;
    }
    @media (min-width: 768px) {
        .sidebar a {
            padding: 0.5rem 0;
            font-size: 0.85rem;
        }
    }
    .sidebar a:hover, .sidebar a.active {
        color: var(--accent-gold);
    }
    .sidebar-spacer {
        display: none;
    }
    @media (min-width: 768px) {
        .sidebar-spacer {
            display: block;
            margin-top: auto;
        }
    }
    .main-content {
        flex: 1;
        padding: 1.5rem;
        overflow-y: auto;
    }
    @media (min-width: 768px) {
        .main-content {
            padding: 2.5rem;
        }
    }
    .card {
        background: var(--card-bg);
        border: 1px solid var(--border-teal);
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(13, 148, 136, 0.1);
        margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) {
        .card { padding: 2rem; }
    }
    h2 { color: var(--accent-gold); margin-top: 0; font-size: 1.2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #1f2937; font-size: 0.8rem; }
    @media (min-width: 768px) { th, td { font-size: 0.85rem; } }
    th { color: var(--border-teal); }
    .btn {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        background: var(--border-teal);
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.85rem;
        border: none;
        cursor: pointer;
        text-align: center;
    }
    .btn:hover { background: var(--hover-teal); }
    input, textarea, select {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        background: #1f2937;
        border: 1px solid #374151;
        color: var(--text-main);
        border-radius: 4px;
        box-sizing: border-box;
        font-family: inherit;
    }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .link-row { margin-top: 1rem; font-size: 0.8rem; text-align: center; }
    .link-row a { color: var(--border-teal); text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
</style>
</head>
<body>
    <div class="sidebar">
        <h1>SECURE VAULT</h1>
        <a href="/dashboard">Dashboard</a>
        <a href="/secrets">Vault Secrets</a>
        <a href="/messaging">Secure Messaging</a>
        <a href="/order">Order & GPS</a>
        <a href="/encryption">AES Encryption</a>
        <a href="/logs">Audit Logs</a>
        <a href="/settings">Settings</a>
        <div class="sidebar-spacer"></div>
        <a href="/logout" style="color: #ef4444;">Lock Vault</a>
</div>
    <div class="main-content">
        <h2>Cryptographic Engine (AES Simulation)</h2>
        <div class="card">
            <form method="POST">
                <label>Operation Mode</label>
                <select name="action">
                    <option value="encrypt">Encrypt Plaintext</option>
                    <option value="decrypt">Decrypt Ciphertext</option>
                </select>
                <label>Data Payload</label>
                <textarea name="text" rows="4" placeholder="Enter payload..." required></textarea>
                <button type="submit" class="btn">Execute Cryptographic Operation</button>
            </form>
            {% if result is not none %}
            <div style="margin-top:1.5rem;">
                <label>Processed Output</label>
                <input type="text" value="{{ result }}" readonly style="color:var(--accent-gold);">
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>

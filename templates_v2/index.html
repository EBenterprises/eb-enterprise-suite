{% extends "base.html" %}
{% block content %}
    {% if session.get('user') %}
        <h1>Vault v2 [Active]</h1>
        <p>Connected session: <code>{{ session['user'] }}</code></p>
        <div class="links" style="justify-content: flex-start; gap: 15px;">
            <a href="{{ url_for('dashboard') }}">[ Dashboard ]</a>
            <a href="{{ url_for('logout') }}">[ Terminate Session ]</a>
        </div>
    {% else %}
        <h1>Secure Vault // v2</h1>
        <p>Cyber-Neon Terminal Interface</p>
        <div class="links" style="margin-top: 30px;">
            <a href="{{ url_for('login') }}">[ Login ]</a>
            <a href="{{ url_for('register') }}">[ Register ]</a>
            <a href="{{ url_for('forgot') }}">[ Recovery ]</a>
        </div>
    {% endif %}
{% endblock %}

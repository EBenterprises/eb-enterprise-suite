{% extends "base.html" %}
{% block content %}
    <h2>Provision Identity</h2>
    <form method="POST">
        <div>
            <label>New Identity</label><br><br>
            <input type="text" name="username" required style="width: 100%; box-sizing: border-box;">
        </div>
        <div>
            <label>Secure Access Key</label><br><br>
            <input type="password" name="password" required style="width: 100%; box-sizing: border-box;">
        </div>
        <input type="submit" value="Register Identity">
    </form>
    <div class="links" style="justify-content: flex-start;">
        <a href="{{ url_for('index') }}">Home</a>
    </div>
{% endblock %}

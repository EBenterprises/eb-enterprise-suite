{% extends "base.html" %}
{% block content %}
    <h2>Override Key</h2>
    <form method="POST">
        <div>
            <label>Reset Token</label><br><br>
            <input type="text" name="token" value="{{ token }}" required style="width: 100%; box-sizing: border-box;">
        </div>
        <div>
            <label>New Access Key</label><br><br>
            <input type="password" name="password" required style="width: 100%; box-sizing: border-box;">
        </div>
        <input type="submit" value="Commit Override">
    </form>
    <div class="links">
        <a href="{{ url_for('login') }}">Cancel</a>
    </div>
{% endblock %}

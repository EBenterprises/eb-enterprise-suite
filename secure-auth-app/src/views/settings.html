<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Executive Spectrum</title>
    <style>
        :root {
            --bg-obsidian: #0b0f19;
            --surface-dark: #131c2e;
            --teal-accent: #00d2c4;
            --gold-highlight: #f39c12;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
        }
        sidebar {
            width: 250px;
            background-color: var(--surface-dark);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .sidebar-brand {
            padding: 1.5rem;
            font-size: 1.125rem;
            font-weight: bold;
            color: var(--teal-accent);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .nav-links li a {
            display: block;
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .nav-links li.active a, .nav-links li a:hover {
            background-color: rgba(0, 210, 196, 0.1);
            color: var(--teal-accent);
            border-left: 3px solid var(--teal-accent);
        }
        .main-content {
            flex: 1;
            padding: 2.5rem;
            box-sizing: border-box;
            overflow-y: auto;
            height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        h1 { margin: 0; color: var(--text-main); font-size: 1.75rem; }
        .card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        select, input[type="checkbox"] {
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 4px;
        }
        select {
            width: 100%;
            padding: 0.75rem;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .checkbox-group input {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--teal-accent);
        }
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--teal-accent);
            color: var(--bg-obsidian);
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.875rem;
        }
        .logout-btn:hover { background-color: rgba(239, 68, 68, 0.1); }
        .success-msg {
            color: var(--teal-accent);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <sidebar>
        <div class="sidebar-brand">Executive Suite</div>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li class="active"><a href="/settings">Settings</a></li>
        </ul>
    </sidebar>
    <div class="main-content">
        <div class="header">
            <h1>Account Settings</h1>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
        <div class="card">
            <div id="successMsg" class="success-msg">Settings saved successfully!</div>
            <form id="settingsForm">
                <div class="form-group">
                    <label>Interface Theme</label>
                    <select id="theme">
                        <option value="obsidian">Obsidian Executive (Default)</option>
                        <option value="midnight">Midnight Deep Teal</option>
                        <option value="slate">Slate Minimal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Language Preference</label>
                    <select id="language">
                        <option value="en">English (US)</option>
                        <option value="fr">French (CA)</option>
                        <option value="de">German</option>
                    </select>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="email_notifications">
                        <label for="email_notifications" style="margin-bottom: 0; color: var(--text-main);">Enable Email Notifications</label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="two_factor">
                        <label for="two_factor" style="margin-bottom: 0; color: var(--text-main);">Enable Two-Factor Authentication (2FA)</label>
                    </div>
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>
    <script>
        fetch('/api/user')
            .then(res => res.json())
            .then(data => {
                if (data.settings) {
                    document.getElementById('theme').value = data.settings.theme || 'obsidian';
                    document.getElementById('language').value = data.settings.language || 'en';
                    document.getElementById('email_notifications').checked = !!data.settings.email_notifications;
                    document.getElementById('two_factor').checked = !!data.settings.two_factor;
                }
            })
            .catch(err => console.error('Failed to load settings'));

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const theme = document.getElementById('theme').value;
            const language = document.getElementById('language').value;
            const email_notifications = document.getElementById('email_notifications').checked ? 1 : 0;
            const two_factor = document.getElementById('two_factor').checked ? 1 : 0;
            const successDiv = document.getElementById('successMsg');

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme, language, email_notifications, two_factor })
                });
                if (res.ok) {
                    successDiv.style.display = 'block';
                    setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
                }
            } catch (err) {
                console.error('Failed to save settings');
            }
        });
    </script>
</body>
</html>

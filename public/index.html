
        <style>
            :root {
                --snap-bg: #07090e;
                --snap-surface: rgba(13, 18, 30, 0.85);
                --snap-teal: #00ffea;
                --snap-gold: #f4c430;
                --snap-border: rgba(0, 255, 234, 0.15);
                --snap-glow: rgba(0, 255, 234, 0.3);
            }
            body { background: var(--snap-bg); color: #f1f5f9; margin: 0; padding: 0; overflow-x: hidden; font-family: system-ui, -apple-system, sans-serif; }
            
            /* SnapMap Interactive Radar Canvas */
            .snapmap-container {
                position: relative;
                width: 100vw;
                height: 100vh;
                background: radial-gradient(circle at 50% 50%, #0f172a 0%, #07090e 80%);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* Tactical Grid Lines Overlay */
            .snapmap-grid-overlay {
                position: absolute;
                inset: 0;
                background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                                  linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
                background-size: 60px 60px;
                pointer-events: none;
            }

            /* Top Header Bar */
            .snap-header {
                position: absolute;
                top: 20px;
                left: 20px;
                right: 20px;
                z-index: 100;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--snap-surface);
                backdrop-filter: blur(16px);
                border: 1px solid var(--snap-border);
                padding: 16px 24px;
                border-radius: 20px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px var(--snap-glow);
            }

            .snap-logo {
                font-size: 1.3rem;
                font-weight: 900;
                color: var(--snap-teal);
                display: flex;
                align-items: center;
                gap: 10px;
                text-shadow: 0 0 12px var(--snap-glow);
            }

            .snap-nav-links {
                display: flex;
                gap: 10px;
            }

            .snap-btn {
                background: rgba(0,255,234,0.06);
                border: 1px solid var(--snap-border);
                color: var(--snap-teal);
                padding: 10px 18px;
                border-radius: 12px;
                font-weight: 700;
                font-size: 0.85rem;
                cursor: pointer;
                text-decoration: none;
                transition: all 0.2s ease;
            }
            .snap-btn:hover { background: rgba(0,255,234,0.15); box-shadow: 0 0 15px var(--snap-glow); }

            /* Pins on Map */
            .snapmap-pins-layer {
                position: absolute;
                inset: 0;
            }

            .snap-pin-wrapper {
                position: absolute;
                transform: translate(-50%, -50%);
                cursor: pointer;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                z-index: 50;
                transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }
            .snap-pin-wrapper:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 60; }

            .snap-avatar-ring {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                border: 3px solid var(--snap-teal);
                overflow: hidden;
                box-shadow: 0 0 20px var(--snap-glow), 0 10px 20px rgba(0,0,0,0.8);
                background: #000;
            }
            .snap-avatar-ring.low-stock { border-color: #ff3366; box-shadow: 0 0 20px rgba(255,51,102,0.4); }
            .snap-avatar-ring img { width: 100%; height: 100%; object-fit: cover; }

            .snap-pin-badge {
                background: rgba(13, 18, 30, 0.9);
                backdrop-filter: blur(8px);
                border: 1px solid var(--snap-border);
                padding: 4px 10px;
                border-radius: 20px;
                font-size: 0.75rem;
                font-weight: 800;
                display: flex;
                gap: 6px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.6);
                white-space: nowrap;
            }
            .pin-name { color: #fff; }
            .pin-stock { color: var(--snap-teal); }
            .pin-stock.danger { color: #ff3366; }

            /* Radar Sweep Animation */
            .radar-pulse {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 60px;
                height: 60px;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                border: 2px solid var(--snap-teal);
                opacity: 0;
                animation: radarPulseAnim 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
                pointer-events: none;
            }
            @keyframes radarPulseAnim {
                0% { width: 40px; height: 40px; opacity: 0.8; }
                100% { width: 160px; height: 160px; opacity: 0; }
            }

            /* Bottom Slide-Up Drawer (SnapMap Profile Card) */
            .snap-drawer {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--snap-surface);
                backdrop-filter: blur(25px);
                border-top: 1px solid var(--snap-border);
                border-radius: 28px 28px 0 0;
                padding: 30px;
                z-index: 200;
                transform: translateY(100%);
                transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: 0 -20px 50px rgba(0,0,0,0.9);
                max-width: 600px;
                margin: 0 auto;
            }
            .snap-drawer.open { transform: translateY(0); }
            
            .drawer-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 20px auto; }
        </style>
    

    <div class="snapmap-container">
        <div class="snapmap-grid-overlay"></div>
        
        <!-- Header -->
        <div class="snap-header">
            <div class="snap-logo">
                🐣 EggFinder® <span style="font-size: 0.75rem; background: rgba(0,255,234,0.1); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--snap-border); color: var(--snap-teal);">SnapMap Live Mesh</span>
            </div>
            <div class="snap-nav-links">
                <a href="/dashboard.html" class="snap-btn">📊 Telemetry</a>
                <a href="/admin.html" class="snap-btn" style="border-color: rgba(244,196,48,0.3); color: var(--snap-gold);">🌾 Producer Portal</a>
            </div>
        </div>

        <!-- Interactive Map Pins Layer -->
        <div class="snapmap-pins-layer" id="snapMapPinsContainer">
            <!-- Dynamically populated via snapmap_engine.js -->
        </div>

        <!-- Slide-Up Farm Detail Drawer -->
        <div class="snap-drawer" id="snapDrawer">
            <div class="drawer-handle"></div>
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                <div>
                    <h2 id="drawerTitle" style="font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 4px;">Farm Name</h2>
                    <p id="drawerDesc" style="color: #94a3b8; font-size: 0.9rem; line-height: 1.4;">Farm description here...</p>
                </div>
                <button onclick="closeSnapDrawer()" style="background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px;">
                <span id="drawerStock" style="font-weight: 800; color: var(--snap-teal);">150 dozen available</span>
                <span id="drawerPrice" style="font-weight: 900; font-size: 1.2rem; color: var(--snap-gold);">$7.50 /dz</span>
            </div>

            <button id="drawerBuyBtn" class="reserve-btn" style="width: 100%; background: linear-gradient(135deg, var(--snap-teal), #00b3a4); color: #030406; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1rem; cursor: pointer; box-shadow: 0 0 25px var(--snap-glow);">
                🔒 Instant Reserve & Pay
            </button>
        </div>
    </div>
    
    <script src="/snapmap_engine.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EggFinder® — Executive Admin & Producer Provisioning</title>
    <style>
        :root {
            --bg-obsidian: #050608;
            --surface-panel: #0d1117;
            --accent-teal: #00ffea;
            --accent-teal-glow: rgba(0, 255, 234, 0.2);
            --accent-gold: #f4c430;
            --accent-gold-glow: rgba(244, 196, 48, 0.3);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-subtle: rgba(0, 255, 234, 0.15);
            --success: #00ff66;
            --danger: #ff3366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-obsidian); color: var(--text-main); padding: 30px 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 1000px; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--surface-panel); border: 1px solid var(--border-subtle); padding: 25px 30px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--accent-gold-glow); }
        .logo h1 { color: var(--accent-gold); font-size: 1.6rem; text-shadow: 0 0 12px var(--accent-gold-glow); display: flex; align-items: center; gap: 12px; }
        .logo p { color: var(--text-dim); font-size: 0.9rem; margin-top: 4px; }
        
        .nav-links { display: flex; gap: 12px; }
        .nav-btn { background: rgba(244,196,48,0.05); border: 1px solid rgba(244,196,48,0.3); color: var(--accent-gold); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 0.85rem; transition: background 0.2s; }
        .nav-btn:hover { background: rgba(244,196,48,0.1); }

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media(max-width: 800px) { .grid-layout { grid-template-columns: 1fr; } }

        .panel { background: var(--surface-panel); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .panel-title { font-size: 1.1rem; font-weight: 800; color: var(--accent-teal); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
        input, textarea { width: 100%; background: var(--bg-obsidian); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--accent-teal); box-shadow: 0 0 8px var(--accent-teal-glow); }
        
        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--accent-gold), #d4a017); color: var(--bg-obsidian); border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer; box-shadow: 0 0 15px var(--accent-gold-glow); transition: filter 0.2s; margin-top: 10px; }
        .submit-btn:hover { filter: brightness(1.1); }

        .station-item { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .station-header { display: flex; justify-content: space-between; align-items: center; }
        .station-name { font-weight: 700; font-size: 1rem; color: var(--text-main); }
        .token-link { font-family: monospace; font-size: 0.8rem; color: var(--accent-teal); background: rgba(0,255,234,0.05); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-subtle); text-decoration: none; display: inline-block; word-break: break-all; }
        .token-link:hover { background: rgba(0,255,234,0.1); }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ffea">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>⚙ Executive Admin <span style="font-size: 0.7rem; color: var(--accent-teal); border: 1px solid var(--accent-teal); padding: 2px 8px; border-radius: 4px;">PRODUCER PROVISIONING</span></h1>
                <p>Register New Farm Stations & Generate Secure Cryptographic Producer Management Portals</p>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-btn" style="color:var(--accent-teal); border-color:var(--accent-teal);">🌐 Consumer Radar</a>
                <a href="/dashboard.html" class="nav-btn" style="color:var(--accent-teal); border-color:var(--accent-teal);">⚡ Telemetry</a>
            </div>
        </header>

        <div class="grid-layout">
            <div class="panel">
                <div class="panel-title">➕ Register New Farm Station</div>
                <form id="farmForm" onsubmit="registerFarm(event)">
                    <div class="form-group">
                        <label>Farm Station Name</label>
                        <input type="text" id="name" required placeholder="e.g. Okanagan Valley Acres">
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>Latitude</label>
                            <input type="number" step="any" id="lat" required value="49.8820">
                        </div>
                        <div>
                            <label>Longitude</label>
                            <input type="number" step="any" id="lng" required value="-119.5900">
                        </div>
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>Initial Stock (Dozens)</label>
                            <input type="number" id="stock" required value="36">
                        </div>
                        <div>
                            <label>Price per Dozen ($)</label>
                            <input type="number" step="0.01" id="price" required value="7.50">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="image" required value="https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=500&auto=format&fit=crop&q=60">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" rows="2" required>Certified organic free-range heritage eggs.</textarea>
                    </div>
                    <button type="submit" class="submit-btn">⚡ Provision Station & Generate Token</button>
                </form>
            </div>

            <div class="panel">
                <div class="panel-title">🔑 Active Producer Management Links</div>
                <div id="producerLinksList">
                    <p style="color:var(--text-dim);">Loading active producer portals...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadProducerPortals() {
            try {
                const res = await fetch('/api/admin/tokens');
                const data = await res.json();
                const container = document.getElementById('producerLinksList');
                
                if (!Object.keys(data).length) {
                    container.innerHTML = '<p style="color:var(--text-dim);">No producer tokens generated yet.</p>';
                    return;
                }

                let html = '';
                for (const [token, info] of Object.entries(data)) {
                    const portalUrl = `${window.location.origin}/manage/${token}`;
                    html += `
                        <div class="station-item">
                            <div class="station-header">
                                <span class="station-name">Station #${info.farmId}</span>
                                <span style="font-size:0.75rem; color:var(--accent-gold);">Token Active</span>
                            </div>
                            <a href="/manage/${token}" target="_blank" class="token-link">${portalUrl}</a>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) {
                console.error('Failed to load tokens:', err);
            }
        }

        async function registerFarm(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                stock: parseInt(document.getElementById('stock').value),
                price: parseFloat(document.getElementById('price').value),
                image: document.getElementById('image').value,
                description: document.getElementById('description').value
            };

            try {
                const res = await fetch('/api/admin/farms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert(`✅ Station successfully registered! Management portal created.`);
                    document.getElementById('farmForm').reset();
                    loadProducerPortals();
                } else {
                    alert(data.error || 'Registration failed.');
                }
            } catch (err) {
                alert('Network error connecting to edge cluster.');
            }
        }

        loadProducerPortals();
    </script>
</body>
</html>

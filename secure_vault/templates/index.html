{% extends "base.html" %}
{% block content %}
    <h1>Secure Vault</h1>
    {% if session.get('user') %}
        <p>Welcome back, <code>{{ session['user'] }}</code>.</p>
        <div class="links">
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    {% else %}
        <p>Encrypted Session Terminal</p>
        <div class="links">
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('forgot') }}">Recovery</a>
        </div>
    {% endif %}
{% endblock %}

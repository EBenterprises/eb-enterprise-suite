<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - Manager Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root { --bg: #09090b; --surface: #121216; --surface-border: #27272a; --accent: #00ff66; --text-main: #f4f4f5; --text-muted: #a1a1aa; }
        * { box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; background: var(--surface); padding: 30px; border: 1px solid var(--surface-border); border-radius: 8px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); }
        h2 { color: var(--accent); margin-top: 0; font-size: 1.2rem; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #09090b; border: 1px solid var(--surface-border); color: #fff; font-family: 'JetBrains Mono', monospace; border-radius: 6px; }
        input:focus { outline: none; border-color: var(--accent); }
        button { width: 100%; padding: 12px; background: var(--accent); color: #000; font-family: 'JetBrains Mono', monospace; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00cc52; }
        .hint { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Manager Login Required</h2>
        <form method="POST" action="/admin/login">
            <input type="password" name="passkey" placeholder="Enter Manager Password..." required>
            <button type="submit">Unlock Manager Access</button>
        </form>
        <div class="hint">Default demo password: <code>VAULT_SECURE_ADMIN_KEY_99</code></div>
        <a href="/" style="display:inline-block; margin-top: 15px; color: var(--text-muted); font-size: 12px; text-decoration: none;">&larr; Back to Home</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Messaging App v7 (Executive Suite)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans">

    <!-- Auth Modal (Login / Register) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50">
        <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl w-96 border border-slate-800">
            <h2 id="auth-title" class="text-2xl font-bold mb-1 text-center text-amber-400">Welcome to v7</h2>
            <p id="auth-subtitle" class="text-xs text-slate-400 text-center mb-6">Secure Executive Authentication</p>
            
            <div id="auth-error" class="hidden mb-4 p-3 bg-rose-950/80 border border-rose-800 text-rose-300 text-xs rounded-xl text-center"></div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                    <input type="text" id="auth-username" required placeholder="Enter handle..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-teal-500 text-slate-100 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-teal-500 text-slate-100 text-sm">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-teal-600 hover:bg-teal-500 text-slate-950 font-semibold py-3 rounded-xl transition shadow-lg shadow-teal-900/30">Sign In</button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button id="auth-toggle-btn" class="text-teal-400 font-semibold hover:underline ml-1">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Main App Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <div class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col hidden md:flex">
            <div class="p-4 border-b border-slate-800 font-bold text-amber-400 flex items-center justify-between text-sm">
                <span>EB Enterprises v7</span>
                <span id="current-user-badge" class="text-xs bg-teal-950 text-teal-400 border border-teal-800/50 px-2 py-0.5 rounded-full"></span>
            </div>

            <!-- Search Bar -->
            <div class="p-3 border-b border-slate-800">
                <input type="text" id="search-input" placeholder="Search messages..." class="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-teal-500">
            </div>

            <!-- Channels Section -->
            <div class="px-4 pt-3 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Channels</div>
            <ul id="channel-list" class="px-2 space-y-1 text-sm border-b border-slate-800 pb-3">
                <li data-room="general" class="channel-btn px-3 py-2 rounded-xl cursor-pointer bg-slate-800 font-medium text-teal-400 flex items-center gap-2"># general</li>
                <li data-room="dev" class="channel-btn px-3 py-2 rounded-xl cursor-pointer hover:bg-slate-800/50 text-slate-300 flex items-center gap-2"># dev</li>
                <li data-room="random" class="channel-btn px-3 py-2 rounded-xl cursor-pointer hover:bg-slate-800/50 text-slate-300 flex items-center gap-2"># random</li>
                <li data-room="watercooler" class="channel-btn px-3 py-2 rounded-xl cursor-pointer hover:bg-slate-800/50 text-slate-300 flex items-center gap-2"># watercooler</li>
            </ul>

            <!-- Direct Messages Section -->
            <div class="px-4 pt-3 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Direct Messages</div>
            <ul id="dm-list" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm">
                <!-- Dynamic DMs -->
            </ul>
        </div>

        <!-- Chat Window -->
        <div class="flex-1 flex flex-col bg-slate-950">
            <div class="p-4 bg-slate-900 border-b border-slate-800 font-bold flex justify-between items-center">
                <span id="room-title" class="text-teal-400 text-base"># general</span>
                <span id="typing-indicator" class="text-xs text-slate-400 italic"></span>
            </div>

            <!-- Messages Area -->
            <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4">
                <!-- Dynamic Messages -->
            </div>

            <!-- Input Area -->
            <form id="chat-form" class="p-4 bg-slate-900 border-t border-slate-800 flex gap-3 items-center">
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl text-slate-300 text-sm transition flex items-center justify-center border border-slate-700/50">
                    📎 <input type="file" id="file-input" class="hidden">
                </label>
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-teal-500 text-slate-100 text-sm">
                <button type="submit" class="bg-teal-600 hover:bg-teal-500 px-6 py-3 rounded-xl font-semibold text-slate-950 transition shadow-lg shadow-teal-900/30">Send</button>
            </form>
        </div>
    </div>

    <script>
        let socket;
        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        const authToggleText = document.getElementById('auth-toggle-text');
        const authError = document.getElementById('auth-error');

        const currentUserBadge = document.getElementById('current-user-badge');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const fileInput = document.getElementById('file-input');
        const chatMessages = document.getElementById('chat-messages');
        const roomTitle = document.getElementById('room-title');
        const typingIndicator = document.getElementById('typing-indicator');
        const channelBtns = document.querySelectorAll('.channel-btn');
        const dmList = document.getElementById('dm-list');
        const searchInput = document.getElementById('search-input');

        let isRegisterMode = false;
        let currentUser = '';
        let currentScopeType = 'room';
        let currentScopeValue = 'general';
        let typingTimeout;
        let attachedFile = null;
        let allMessagesCache = [];

        authToggleBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            if (isRegisterMode) {
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Register secure credentials';
                authSubmitBtn.textContent = 'Register & Sign In';
                authToggleText.textContent = 'Already have an account?';
                authToggleBtn.textContent = 'Sign In';
            } else {
                authTitle.textContent = 'Welcome to v7';
                authSubtitle.textContent = 'Secure Executive Authentication';
                authSubmitBtn.textContent = 'Sign In';
                authToggleText.textContent = "Don't have an account?";
                authToggleBtn.textContent = 'Create Account';
            }
            authError.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = authUsername.value.trim();
            const password = authPassword.value;
            const endpoint = isRegisterMode ? '/api/register' : '/api/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data.username;
                    currentUserBadge.textContent = currentUser;
                    authModal.classList.add('hidden');
                    
                    socket = io();
                    initSocketListeners();
                    socket.emit('register_session', currentUser);
                    socket.emit('join_room', 'general');
                } else {
                    authError.textContent = data.error;
                    authError.classList.remove('hidden');
                }
            } catch (err) {
                authError.textContent = 'Network or server error occurred.';
                authError.classList.remove('hidden');
            }
        });

        function initSocketListeners() {
            channelBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    channelBtns.forEach(b => b.classList.remove('bg-slate-800', 'text-teal-400'));
                    document.querySelectorAll('.dm-btn').forEach(b => b.classList.remove('bg-slate-800', 'text-teal-400'));
                    btn.classList.add('bg-slate-800', 'text-teal-400');
                    
                    currentScopeType = 'room';
                    currentScopeValue = btn.getAttribute('data-room');
                    roomTitle.textContent = `# ${currentScopeValue}`;
                    chatMessages.innerHTML = '';
                    socket.emit('join_room', currentScopeValue);
                });
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        attachedFile = {
                            data: event.target.result,
                            name: file.name,
                            type: file.type
                        };
                        msgInput.placeholder = `Attached: ${file.name}`;
                    };
                    reader.readAsDataURL(file);
                }
            });

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = msgInput.value.trim();
                if (text || attachedFile) {
                    socket.emit('chat_message', { 
                        text: text || (attachedFile ? `Shared file: ${attachedFile.name}` : ''), 
                        file: attachedFile ? attachedFile.data : null,
                        fileName: attachedFile ? attachedFile.name : null
                    });
                    msgInput.value = '';
                    msgInput.placeholder = 'Type a message...';
                    attachedFile = null;
                    fileInput.value = '';
                    socket.emit('typing', false);
                }
            });

            msgInput.addEventListener('input', () => {
                if (currentScopeType === 'room') {
                    socket.emit('typing', true);
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        socket.emit('typing', false);
                    }, 1000);
                }
            });

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const messageNodes = chatMessages.querySelectorAll('.message-item');
                messageNodes.forEach(node => {
                    const text = node.textContent.toLowerCase();
                    node.style.display = text.includes(query) ? 'flex' : 'none';
                });
            });

            socket.on('load_history', (history) => {
                chatMessages.innerHTML = '';
                allMessagesCache = [];
                history.forEach(msg => appendMessage(msg));
            });

            socket.on('message', (data) => {
                appendMessage(data);
            });

            socket.on('update_reactions', ({ messageId, reactions }) => {
                const container = document.getElementById(`reactions-${messageId}`);
                if (container) {
                    let html = '';
                    for (let [emoji, users] of Object.entries(reactions)) {
                        const hasReacted = users.includes(currentUser);
                        html += `<button onclick="toggleReaction('${messageId}', '${emoji}')" class="text-xs px-2 py-0.5 rounded-lg border ${hasReacted ? 'bg-teal-950 border-teal-700 text-teal-300' : 'bg-slate-900 border-slate-800 text-slate-300'} flex items-center gap-1">${emoji} <span>${users.length}</span></button>`;
                    }
                    container.innerHTML = html;
                }
            });

            socket.on('update_global_users', (users) => {
                dmList.innerHTML = users
                    .filter(u => u !== currentUser)
                    .map(user => `<li onclick="startDM('${user}')" class="dm-btn-${user} dm-btn px-3 py-2 rounded-xl cursor-pointer hover:bg-slate-800/50 text-slate-300 flex items-center gap-2 text-sm"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span>${user}</li>`)
                    .join('');
            });

            socket.on('typing', (data) => {
                if (data.isTyping && currentScopeType === 'room') {
                    typingIndicator.textContent = `${data.user} is typing...`;
                } else {
                    typingIndicator.textContent = '';
                }
            });
        }

        function appendMessage(data) {
            allMessagesCache.push(data);
            const div = document.createElement('div');
            div.className = 'flex flex-col message-item group';
            div.setAttribute('data-id', data.id);

            let fileHTML = '';
            if (data.file) {
                if (data.fileName && /\.(jpg|jpeg|png|gif|webp)$/i.test(data.fileName)) {
                    fileHTML = `<div class="mt-2"><img src="${data.file}" class="max-w-xs rounded-xl border border-slate-800 shadow-md"></div>`;
                } else {
                    fileHTML = `<div class="mt-2"><a href="${data.file}" download="${data.fileName || 'file'}" class="text-teal-400 underline text-xs">📥 Download ${data.fileName || 'attachment'}</a></div>`;
                }
            }

            let reactionsHTML = '';
            if (data.reactions) {
                for (let [emoji, users] of Object.entries(data.reactions)) {
                    const hasReacted = users.includes(currentUser);
                    reactionsHTML += `<button onclick="toggleReaction('${data.id}', '${emoji}')" class="text-xs px-2 py-0.5 rounded-lg border ${hasReacted ? 'bg-teal-950 border-teal-700 text-teal-300' : 'bg-slate-900 border-slate-800 text-slate-300'} flex items-center gap-1">${emoji} <span>${users.length}</span></button>`;
                }
            }

            div.innerHTML = `
                <div class="flex items-baseline gap-2">
                    <span class="font-bold text-teal-400 text-sm">${data.user}</span>
                    <span class="text-xs text-slate-500">${data.time}</span>
                </div>
                <div class="bg-slate-900 p-3.5 rounded-2xl mt-1 max-w-lg border border-slate-800 text-slate-200 text-sm relative">
                    <div>${data.text}</div>
                    ${fileHTML}
                    <div id="reactions-${data.id}" class="flex flex-wrap gap-1.5 mt-2">${reactionsHTML}</div>
                    
                    <div class="absolute right-2 -top-3 hidden group-hover:flex bg-slate-800 border border-slate-700 rounded-lg p-1 shadow-lg gap-1">
                        <button onclick="toggleReaction('${data.id}', '❤️')" class="hover:bg-slate-700 px-1.5 py-0.5 rounded text-xs">❤️</button>
                        <button onclick="toggleReaction('${data.id}', '👍')" class="hover:bg-slate-700 px-1.5 py-0.5 rounded text-xs">👍</button>
                        <button onclick="toggleReaction('${data.id}', '🔥')" class="hover:bg-slate-700 px-1.5 py-0.5 rounded text-xs">🔥</button>
                        <button onclick="toggleReaction('${data.id}', '🚀')" class="hover:bg-slate-700 px-1.5 py-0.5 rounded text-xs">🚀</button>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        window.toggleReaction = function(messageId, emoji) {
            socket.emit('add_reaction', {
                messageId,
                emoji,
                room: currentScopeType === 'room' ? currentScopeValue : null,
                targetUser: currentScopeType === 'dm' ? currentScopeValue : null
            });
        };

        window.startDM = function(targetUser) {
            channelBtns.forEach(b => b.classList.remove('bg-slate-800', 'text-teal-400'));
            document.querySelectorAll('.dm-btn').forEach(b => b.classList.remove('bg-slate-800', 'text-teal-400'));
            
            const activeDmBtn = document.querySelector(`.dm-btn-${targetUser}`);
            if (activeDmBtn) activeDmBtn.classList.add('bg-slate-800', 'text-teal-400');

            currentScopeType = 'dm';
            currentScopeValue = targetUser;
            roomTitle.textContent = `@ ${targetUser}`;
            chatMessages.innerHTML = '';
            socket.emit('join_dm', targetUser);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - Sign In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .box { width: 100%; max-width: 400px; background: #121216; padding: 25px; border: 1px solid #27272a; border-radius: 8px; box-sizing: border-box; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #09090b; color: #fff; border: 1px solid #27272a; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #00ff66; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="color:#00ff66; margin-top:0;">Vault Sign In</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Authenticate</button>
    <p style="font-size:12px; text-align:right; margin-top:5px;"><a href="/forgot" style="color:#a1a1aa;">Forgot password?</a></p>
    </form>
    <p style="font-size:13px; text-align:center; margin-top:15px;"><a href="{{ url_for('register') }}" style="color:#00ff66;">Create Account</a></p>
</div>
</body></html>

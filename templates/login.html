{% extends "base.html" %}
{% block content %}
<h2>🔒 Vault V5 Login</h2>
<form method="POST">
    <div class="input-group"><input type="text" name="username" placeholder="Username or Email" required autocomplete="off"></div>
    <div class="input-group"><input type="password" name="password" placeholder="Password" required></div>
    <button type="submit">Authenticate</button>
</form>
<div class="links"><a href="/register/step1">Create Account</a><a href="/forgot">Forgot Password?</a></div>
{% endblock %}

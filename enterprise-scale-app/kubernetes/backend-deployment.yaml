apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-backend-deployment
  labels:
    app: enterprise-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-backend
  template:
    metadata:
      labels:
        app: enterprise-backend
    spec:
      containers:
      - name: backend
        image: enterprise-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: enterprise-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: enterprise-secrets
              key: jwt-secret
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-backend-service
spec:
  type: LoadBalancer
  selector:
    app: enterprise-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000

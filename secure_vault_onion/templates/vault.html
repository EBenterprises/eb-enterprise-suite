<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - System Status</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root { --bg: #09090b; --surface: #121216; --surface-border: #27272a; --accent: #00ff66; --text-main: #f4f4f5; --text-muted: #a1a1aa; }
        * { box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--surface); padding: 30px; border: 1px solid var(--surface-border); border-radius: 8px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); padding-bottom: 15px; margin-bottom: 25px; }
        h2 { font-size: 1.4rem; color: var(--accent); margin: 0; }
        .stat-box { background: #09090b; border: 1px solid var(--surface-border); padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
        .stat-box div { margin-bottom: 8px; word-break: break-all; }
        .stat-box span { color: var(--text-muted); display: inline-block; width: 160px; }
        pre { background: #09090b; border: 1px solid var(--surface-border); padding: 15px; border-radius: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--accent); }
        .btn { display: inline-block; padding: 10px 20px; background: var(--surface-border); color: var(--text-main); text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .btn:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>System Health & Storage</h2>
            <a href="/" class="btn">&larr; Home</a>
        </header>
        <div class="stat-box">
            <div><span>Database File:</span> {{ db_path }}</div>
            <div><span>Total Stored Orders:</span> {{ total_records }}</div>
        </div>
        <h3>Public Encryption Key</h3>
        <pre>{{ public_key_pem }}</pre>
    </div>
</body>
</html>

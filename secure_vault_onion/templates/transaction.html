<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - Order Details</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root {
            --bg: #09090b; --surface: #121216; --surface-border: #27272a;
            --accent: #00ff66; --accent-glow: rgba(0, 255, 102, 0.2);
            --text-main: #f4f4f5; --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--surface); padding: 30px; border: 1px solid var(--surface-border); border-radius: 8px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); padding-bottom: 15px; margin-bottom: 25px; }
        h2 { font-size: 1.4rem; color: var(--accent); margin: 0; }
        .meta-box { background: #09090b; border: 1px solid var(--surface-border); padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
        .meta-box div { margin-bottom: 10px; word-break: break-all; }
        .meta-box span { color: var(--text-muted); display: inline-block; width: 150px; }
        .payload-box { background: #09090b; border: 1px solid var(--accent); box-shadow: 0 0 10px var(--accent-glow); padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        .payload-box h3 { margin-top: 0; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; }
        pre { white-space: pre-wrap; word-break: break-all; color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; font-size: 13px; }
        .btn { display: inline-block; padding: 10px 20px; background: var(--surface-border); color: var(--text-main); text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: bold; transition: all 0.2s; }
        .btn:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>Order Details #{{ tx[0] }}</h2>
            <a href="/" class="btn">&larr; Back to Home</a>
        </header>
        
        <div class="meta-box">
            <div><span>Order Number:</span> #{{ tx[0] }}</div>
            <div><span>Date Received:</span> {{ tx[1] }}</div>
            <div><span>Reference Code:</span> <span style="color: var(--accent);">{{ tx[2] }}</span></div>
            <div><span>Order Status:</span> <strong>{{ tx[3] }}</strong></div>
        </div>

        <div class="payload-box">
            <h3>Decrypted Message / Order Content</h3>
            <pre>{{ tx[4] }}</pre>
        </div>

        <a href="/admin" class="btn" style="background: var(--accent); color: #000;">Manage in Manager Panel</a>
    </div>
</body>
</html>
